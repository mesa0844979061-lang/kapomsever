# Sidebar title. MiniMessage (gradients/hex) or legacy & codes both work.
scoreboard-title: "<gradient:#FF512F:#F09819><bold>KAPOM</bold></gradient>"

# -1 = off (safe). 17 = NPC skin "second layer" for 1.20.2 - 1.21.8. Wrong value => Network Protocol Error.
skin-layer-index: -1

# Height of the tier tag above the head. Raise it if it overlaps the player's name, lower it if too high.
tier-tag-height: 0.75

# Show [TIER] before names in chat
chat-format: true

# Default tier colors (by exact tier or by letters only, e.g. MT5 -> MT). Single color or gradient "#A:#B".
# Override per player with /tier color <player> <color>
tier-colors:
  HT1: "#FFD700:#FF8C00"
  HT2: "#FF4D4D:#FF9F1C"
  HT3: "#FF7B54:#FFB26B"
  HT4: "#FF9F1C"
  HT5: "#FFC15E"
  HT: "#FF4D4D:#FF9F1C"
  MT1: "#B517FF:#7B2FF7"
  MT2: "#C77DFF:#7B2FF7"
  MT3: "#C77DFF"
  MT4: "#D0A2FF"
  MT5: "#E0C3FF"
  MT: "#C77DFF:#7B2FF7"
  LT1: "#00F5A0:#00D9F5"
  LT2: "#38EF7D:#11998E"
  LT3: "#4CC9F0"
  LT4: "#7FDBFF"
  LT5: "#A8E6FF"
  LT: "#4CC9F0:#00F5A0"

combat:
  enabled: true
  seconds: 15
  kill-on-logout: true        # logging out in combat = death (killer gets the kill)
  blocked-commands: [spawn, home, homes, tpa, tpaccept, warp, hub, lobby, back, tp, rtp, kit]

kills:
  effects: true               # lightning effect + sound on kill
  same-victim-cooldown: 30    # seconds; killing the same player again within this gives no credit
  streak-milestone: 5         # broadcast every N kills in a row (0 = off)
  reward-commands: []         # e.g. ["eco give %killer% 50", "heal %killer%"]
