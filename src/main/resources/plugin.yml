name: KapomCore
main: th.kapom.core.KapomPlugin
version: 1.2.0
api-version: '1.21'
depend: [Multiverse-Core, packetevents]
commands:
  kapom:
    description: Main KapomCore command
    usage: /kapom help
  tier:
    description: Set a player tier and its color
    usage: /tier add <player> <tier> [color]
  npc:
    description: Set the NPC destination world
    usage: /npc <name> set <world>
  stats:
    description: Show player stats
    usage: /stats [player]
    aliases: [pvpstats]
  top:
    description: Show rankings
    usage: /top [kills|deaths|wins|streak|kdr|playtime]
    aliases: [leaderboard, lb]
permissions:
  kapom.admin:
    default: op
  kapom.combat.bypass:
    default: op
