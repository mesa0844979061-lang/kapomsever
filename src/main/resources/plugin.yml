name: KapomCore
main: th.kapom.core.KapomPlugin
version: 1.0.0
api-version: '1.21'
depend: [Multiverse-Core, packetevents]
commands:
  kapom:
    description: Main KapomCore command
    usage: /kapom <spawn|remove|win|lose>
    permission: kapom.admin
  tier:
    description: Set a player tier
    usage: /tier add <player> <tier>
    permission: kapom.admin
  npc:
    description: Set the NPC destination world
    usage: /npc <name> set <world>
    permission: kapom.admin
permissions:
  kapom.admin:
    default: op
