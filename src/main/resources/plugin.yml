name: KapomTier
main: th.kapom.tier.TierPlugin
version: 1.0.0
api-version: '1.21'
softdepend: [KapomCore]
commands:
  tierreload:
    description: Reload KapomTier config
    permission: kapom.admin
  pvp:
    description: Open PVP menu
  duel:
    description: Challenge a player to a duel
    usage: /duel <player> | /duel accept <player>
  stats:
    description: View PvP stats
    usage: /stats [player]
  top:
    description: Leaderboard by kills / streak
    usage: /top [kills|streak]
permissions:
  kapom.admin:
    default: op
